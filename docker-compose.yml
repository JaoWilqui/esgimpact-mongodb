# =====================================================================
# ESGImpact — ambiente LOCAL de desenvolvimento
# ---------------------------------------------------------------------
#   docker compose up -d --build   -> API + MongoDB + Mongo Express
#   docker compose ps
#   docker compose logs -f api
#   docker compose down            -> para (mantém os dados)
#   docker compose down -v         -> para e APAGA os volumes
#
#   API / Swagger : http://localhost:8080/swagger
#   Mongo Express : http://localhost:8081   (admin / esgadmin)
#
# Staging e produção usam deploy/docker-compose.deploy.yml, acionado
# pelo pipeline de CI/CD (ver README).
# =====================================================================

services:
  # -------------------------------------------------------------------
  # API .NET 8 — construída a partir do Dockerfile da raiz
  # -------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: dev
        GIT_SHA: local
    image: esgimpact-api:dev
    container_name: esgimpact-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://mongo:27017
      MongoDb__Database: ${MONGO_DATABASE:-esgimpact}
      MongoDb__Username: ${MONGO_ROOT_USER:-esgadmin}
      MongoDb__Password: ${MONGO_ROOT_PASSWORD:-Esg@Mongo2026}
      Jwt__Key: ${JWT_KEY:-esg-impact-super-secret-signing-key-change-me-2026!!}
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - backend

  # -------------------------------------------------------------------
  # MongoDB 7.0 — scripts de mongo/init rodam na PRIMEIRA subida
  # (volume vazio), criando as collections, os índices e a carga.
  # -------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: esgimpact-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-esgadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-Esg@Mongo2026}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-esgimpact}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
      - ./mongo/init:/scripts/init:ro
      - ./mongo/crud:/scripts/crud:ro
    networks:
      - backend
    healthcheck:
      # conecta pelo hostname (e nao por localhost): durante a carga inicial o
      # mongod temporario so escuta em 127.0.0.1, entao o banco so fica
      # "healthy" depois que todos os scripts de mongo/init terminaram.
      test: ["CMD-SHELL", "mongosh --quiet --host \"$$(hostname)\" --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------------------------
  # Interface web do banco (somente no ambiente local)
  # -------------------------------------------------------------------
  mongo-express:
    image: mongo-express:1.0.2
    container_name: esgimpact-mongo-express
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-esgadmin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-Esg@Mongo2026}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD:-esgadmin}
    ports:
      - "${ME_PORT:-8081}:8081"
    networks:
      - backend

volumes:
  mongo-data:
  mongo-config:

networks:
  backend:
    driver: bridge
